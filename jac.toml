[project]
name = "triage"
version = "0.1.0"
description = "Triage - a structural, graph-native lens on the GitHub issue queue."
entry-point = "main.jac"
kind = "fullstack"

[dependencies]
# byLLM ships bundled inside the jac binary itself (jaclang.byllm) - no
# separate pip package needed or wanted. A `byllm = "..."` pip dependency
# here shadows the compatible bundled copy with an incompatible PyPI fork
# (uses `by postinit`/`global` syntax this compiler can't parse) and breaks
# EVERY by llm() call project-wide. If you see "Missing ';'" errors deep in
# a byllm/*.jac traceback, check here first before touching Ollama/API keys.

[dependencies.npm]
tailwindcss = "^4.0.0"
"@tailwindcss/vite" = "^4.0.0"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"
port = 8000

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# Single place the whole team configures the LLM (CLAUDE.md #7: "Don't scatter
# model names"). This has flip-flopped in git history between [byllm.model]
# and [plugins.byllm.model] - settled by reading the bundled plugin source
# directly (site-packages/byllm/config_loader.jac docstring: "Configuration
# is loaded from jac.toml under [plugins.byllm] section", backed by
# PluginConfigBase). A bare [byllm.model] is NOT read by the plugin at all.
[plugins.byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-ollama/qwen2.5:7b}"
