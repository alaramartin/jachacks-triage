[project]
name = "triage"
version = "0.1.0"
description = "Triage - a structural, graph-native lens on the GitHub issue queue."
entry-point = "main.jac"
kind = "fullstack"

[dependencies]
# byLLM ships bundled inside the jac binary itself (jaclang.byllm) - no
# separate pip package needed or wanted. A `byllm = "..."` pip dependency
# here shadows the compatible bundled copy with an incompatible PyPI fork
# (uses `by postinit`/`global` syntax this compiler can't parse) and breaks
# EVERY by llm() call project-wide. If you see "Missing ';'" errors deep in
# a byllm/*.jac traceback, check here first before touching Ollama/API keys.

[dependencies.npm]
tailwindcss = "^4.0.0"
"@tailwindcss/vite" = "^4.0.0"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
# Required by jac 0.34.7's GENERATED client runtime, which does an
# unconditional `import { useForm } from "@tanstack/react-form"` in
# client_runtime.js - none of our own client code uses forms. Without it
# Vite fails to resolve the dep and the browser shows
# "Failed to fetch dynamically imported module: /compiled/_entry.js",
# i.e. a blank app with only an error overlay. Do not remove.
"@tanstack/react-form" = "^1.33.2"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"
port = 8000

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# Single place the whole team configures the LLM (CLAUDE.md #7: "Don't scatter
# model names").
#
# THIS TABLE NAME IS ENVIRONMENT-SPECIFIC - it has flip-flopped in git history
# because the two environments genuinely disagree (see PLAN.md's env-split
# table). P3 read the STANDALONE byllm 0.6.19 source and correctly found it
# wants [plugins.byllm]. The demo machine runs jac 0.34.7 with byllm BUNDLED,
# where that table is silently ignored.
#
# Settled empirically on the demo machine, not by reading source: set
# default_model to a bogus name under each table and run a by llm() call.
#   [plugins.byllm.model] + bogus -> falls back to OpenAI  => NOT read
#   [byllm.model]         + bogus -> error names the bogus model => IS read
# Getting this wrong is silent: every by llm() call falls back to OpenAI and
# fails with no API key. If you switch machines, re-run that probe.
[byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-ollama/qwen2.5:7b}"
