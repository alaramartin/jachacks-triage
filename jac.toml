[project]
name = "triage"
version = "0.1.0"
description = "Triage — a structural, graph-native lens on the GitHub issue queue."
entry-point = "main.jac"
kind = "fullstack"

[dependencies]
byllm = "~=0.6"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"
port = 8000

[client]

# Single place the whole team configures the LLM (CLAUDE.md #7: "Don't scatter
# model names"). Verified against jac-config docs + a live jac test run:
# [byllm.model] is a top-level table, NOT [plugins.byllm.model] - the old
# [plugins.<name>] path silently fails to parse and byLLM falls back to
# OpenAI (which errors with no API key set).
[byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-ollama/qwen2.5:7b}"
